<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Phrase Drill</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d2330;--mu:#6a7080;--ac:#1f4fd8;--ok:#167a3e;--okb:#e3f4e9;--no:#b3261e;--nob:#fbe7e5;--bd:#dcd8cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--sf:#1e222d;--tx:#eceef4;--mu:#9aa1b4;--ac:#7fa2ff;--ok:#6fd195;--okb:#16301f;--no:#ff8f86;--nob:#3a1b19;--bd:#323848;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--sf:#1e222d;--tx:#eceef4;--mu:#9aa1b4;--ac:#7fa2ff;--ok:#6fd195;--okb:#16301f;--no:#ff8f86;--nob:#3a1b19;--bd:#323848;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mu);font:14px system-ui,sans-serif;margin-bottom:16px}
.ui{font-family:system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{font:13px system-ui,sans-serif;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 11px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px}
.tag{font:12px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.ctx{font-size:20px;margin:6px 0 14px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.row{display:flex;justify-content:space-between;font:13px system-ui,sans-serif;color:var(--mu);margin-bottom:6px}
textarea,input.f{width:100%;font:17px Georgia,serif;padding:10px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);resize:vertical}
.cl{line-height:2.4}
.cl input{font:17px Georgia,serif;border:0;border-bottom:2px solid var(--ac);background:transparent;color:var(--tx);padding:0 2px;text-align:center;outline:0}
.cl input.x{border-color:var(--no);color:var(--no);background:var(--nob)}
.cl input.v{border-color:var(--ok);color:var(--ok)}
.btn{font:600 15px system-ui,sans-serif;background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:11px 20px;cursor:pointer;margin-top:14px}
.btn.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.res{margin-top:14px;padding:14px;border-radius:10px}
.res.ok{background:var(--okb);color:var(--ok)}
.res.no{background:var(--nob);color:var(--tx)}
.res b.h{display:block;font:600 14px system-ui,sans-serif;color:var(--no);margin-bottom:6px}
.ans{font-size:19px}
.miss{background:var(--no);color:var(--bg);border-radius:4px;padding:0 3px}
.hint{font:13px system-ui,sans-serif;color:var(--mu);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;text-align:center;padding:8px 2px;font:12px system-ui,sans-serif;color:var(--mu)}
.stats b{display:block;font-size:20px;color:var(--tx)}
ul{padding-left:20px}li{margin:4px 0}
</style></head><body><main>
<h1>Call Phrase Drill</h1>
<div class="sub ui">Retype from memory. Every mistake shows the answer, then you must type it correctly before moving on. Missed cards come back within a few turns.</div>
<div id="app"></div>
</main>
<script>
const D=[
["Opening","Greet and ask the customer’s name","Thank you for calling [Brand], my name is [X]. May I have your name, please?"],
["Opening","Greet (alternative, warmer)","Thanks for calling [Brand], this is [X] speaking. Who do I have the pleasure of speaking with?"],
["Opening","After they give their name","Nice to meet you, [Name]. How can I help you today?"],
["Reassurance","Neutral request","Absolutely, I can help with that."],
["Reassurance","Customer is worried","I understand, and I’m going to take care of this for you."],
["Reassurance","Customer is upset","I’m sorry for the trouble, and I completely understand why you’re frustrated. Let me make this right."],
["Reassurance","Show ownership","I’ll personally follow this through until we have a solution."],
["Billing","Ask for account info","To pull up your information, may I have the billing name and billing address on the account?"],
["Billing","Confirm the delivery address","Thank you. And just to confirm, is that the same address for the delivery?"],
["Billing","You didn’t catch the spelling","Could you spell that for me, please?"],
["Probing","Check you understood the issue","Just so I understand correctly, you’re calling because...?"],
["Probing","Ask for the timeline","When did you place the order?"],
["Probing","Invite more detail","Could you tell me a bit more about what happened?"],
["Resolution","Introduce your solution","Here’s what I’m going to do for you..."],
["Resolution","Offer your best option","The best solution I can offer is..."],
["Resolution","Confirm the fix is done","I’ve taken care of that. Here’s what happens next..."],
["Promo","Website and app (tracking, offers, returns)","Before I let you go, did you know you can track your orders, see offers, and manage returns on our website and the Gap app?"],
["Promo","Rewards program","If you’re not a member yet, our rewards program gives you early access to offers. You can join for free on the website or app."],
["Promo","App tracking updates","For next time, the app sends you tracking updates automatically, so you won’t even need to call."],
["Closing","Recap the call","Just to recap, [issue], and [solution], and you’ll [next step]."],
["Closing","Ask if there is more","Is there anything else I can help you with today?"],
["Closing","Say goodbye","Thank you for calling [Brand], [Name]. Have a wonderful day!"],
["Reassurance","Where is my order?","I understand you want to know where your order is. Let me check that right now."],
["Resolution","Where is my order?","I see your order is [status]. It shipped on [date] with [carrier], and the estimated delivery is [date]. I can also send the tracking link to your email."],
["Reassurance","Change an order","Of course, let me see if we can still make that change."],
["Resolution","Change an order (not shipped yet)","Good news, your order hasn’t shipped yet, so I can update it for you."],
["Resolution","Change an order (already shipped)","Unfortunately it already left our warehouse, so I can’t change it, but once you receive it I can help you with a return or exchange."],
["Reassurance","Cancel an order","I understand, let me check the status of your order."],
["Probing","Cancel an order","May I ask the reason for the cancellation?"],
["Resolution","Cancel an order","I’ve submitted the cancellation. You’ll receive a confirmation email, and the refund will go back to your original payment method."],
["Reassurance","Didn’t receive it","I’m sorry your order hasn’t arrived. That’s frustrating, and I’ll help you get this solved."],
["Probing","Didn’t receive it","Does the tracking say delivered? Did you check with neighbors or the front desk?"],
["Resolution","Didn’t receive it","I’ll open an investigation with the carrier. Once it’s complete, we’ll send you a replacement or a refund, whichever you prefer."],
["Reassurance","Don’t like it (return)","No problem at all, we want you to be happy with your purchase."],
["Probing","Don’t like it (return)","Do you still have the tags and the original packaging?"],
["Resolution","Don’t like it (return)","I’ll email you the return label, and your refund will go to your original payment method."],
["Reassurance","Wrong size (exchange)","That happens, and it’s easy to fix."],
["Probing","Wrong size (exchange)","What size did you receive, and what size do you need?"],
["Resolution","Wrong size (size available)","Let me check that the [size] is available. Yes, it is! I’ll set up the exchange and send you a label."],
["Resolution","Wrong size (out of stock)","That size is out of stock right now. I can refund you, or suggest a similar style."],
["Reassurance","Defective or damaged","I’m very sorry about that. That’s not the quality we want you to receive."],
["Probing","Defective or damaged","What exactly is wrong with it? When did you receive it?"],
["Resolution","Defective or damaged","I’ll send you a replacement at no cost, or a full refund, whichever you prefer. You don’t need to pay for the return shipping."],
["Reassurance","Offers and discounts","Great question, let me find the best offer available for you."],
["Resolution","Offers and discounts","Right now we have [offer], valid until [date]. I can apply it to your order today."],
["Reassurance","Promo or campaign question","I’d be happy to explain how that promotion works."],
["Resolution","Promo (doesn’t apply)","I’m sorry, that one doesn’t apply to this item, but here’s what I can offer instead."],
["Reassurance","Price adjustment","Let me see if you qualify for a price adjustment."],
["Resolution","Price adjustment (eligible)","Yes, you’re within the window, so I’ll adjust the difference back to your original payment method."],
["Resolution","Price adjustment (not eligible)","Unfortunately that purchase is outside the adjustment window, but I want to be transparent so you know exactly why."],
["Reassurance","Refund status","I understand you’re waiting for your refund. Let me look at that."],
["Resolution","Refund status","I can see the refund was issued on [date]. Banks usually take a few days to show it. If it doesn’t appear by then, call us back and I’ll personally look into it."],
["Reassurance","Loyalty rewards","Of course, let me check your rewards account."],
["Resolution","Loyalty rewards","You currently have [points]. Your next benefit is [X]."],
["Reassurance","Gift card balance","No problem, I can help you check that."],
["Probing","Gift card balance","Do you have the gift card number and the PIN?"],
["Reassurance","Account security / password","I understand, and I’ll help you get back into your account safely."],
["Resolution","Account security / password","For your security, I’ll send a password reset link to your email on file. Please don’t share the link with anyone."],
["Vocab","Smoother way to say “Wait please”","Let me pull that up for you."],
["Vocab","Smoother way to say “I don’t know”","That’s a great question, let me find out."],
["Vocab","Smoother way to say “Sorry”","I sincerely apologize for the inconvenience."],
["Vocab","Smoother way to say “No, I can’t”","What I can do is..."],
["Vocab","Confident way to say “Okay” (two options)","Absolutely. Of course."],
["Vocab","Show ownership: you will handle it","I’ll take care of that for you."],
["Vocab","Make sure they leave happy","I want to make sure you leave this call happy."],
["Vocab","Empathy: you imagine their frustration","I can imagine how frustrating that is."],
["Vocab","Empathy: thank them for waiting","Thank you for your patience."]
];
const CATS=["All",...new Set(D.map(d=>d[0]))];
let box={},cat="All",Q=[],cur=null,first={},missed=new Set(),tot=0,done=0,right=0,stage="idle",SIZE=20;
try{box=JSON.parse(localStorage.getItem("gapbox")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("gapbox",JSON.stringify(box))}catch(e){}};
const B=i=>box[i]||1;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const nw=s=>s.toLowerCase().replace(/\[[^\]]*\]/g," ").replace(/[’'"“”]/g,"").replace(/[^a-z0-9$ ]+/g," ").split(/\s+/).filter(Boolean);
function lcs(a,b){const m=a.length,n=b.length,t=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)t[i][j]=a[i-1]==b[j-1]?t[i-1][j-1]+1:Math.max(t[i-1][j],t[i][j-1]);return t[m][n]}
function stats(){const c=[0,0,0,0,0,0];D.forEach((d,i)=>c[B(i)]++);return `<div class="stats">${[1,2,3,4,5].map(l=>`<div><b>${c[l]}</b>Level ${l}</div>`).join("")}</div>`}
function home(){stage="idle";const n=D.filter(d=>cat=="All"||d[0]==cat).length;
$("#app").innerHTML=`<div class="card"><div class="tag">Your progress</div>${stats()}
<div class="hint">Level 1–2: fill in the blanks (more blanks at Level 2). Level 3 and up: full recall from memory. A mistake drops the card back to Level 1. Level 5 means you own it.</div>
<div class="chips">${CATS.map(c=>`<button class="chip ${c==cat?"on":""}" onclick="cat='${c}';home()">${c}</button>`).join("")}</div>
<button class="btn" onclick="start()">Start drill (${Math.min(SIZE,n)} of ${n} cards, weakest first)</button>
<button class="btn g" style="margin-left:8px" onclick="if(confirm('Reset all progress?')){box={};save();home()}">Reset</button></div>`}
function start(){let ids=D.map((d,i)=>i).filter(i=>cat=="All"||D[i][0]==cat);ids.sort((a,b)=>B(a)-B(b)+(Math.random()-.5)*1.5);Q=ids.slice(0,SIZE);tot=Q.length;done=0;right=0;first={};missed=new Set();next()}
function next(){if(!Q.length)return end();cur=Q.shift();stage="ask";draw()}
function draw(){const d=D[cur],lv=B(cur),ws=d[2].split(" ");let idx=[];
ws.forEach((w,i)=>{const n=nw(w);if(n.length&&n[0].length>3&&!w.includes("["))idx.push(i)});
const cl=lv<3&&idx.length>=3;
if(cl){const k=Math.max(2,Math.round(idx.length*(lv==1?.4:.7)));cur_h=idx.sort(()=>Math.random()-.5).slice(0,k)}else cur_h=[];
let body;
if(cl)body=`<div class="cl">${ws.map((w,i)=>cur_h.includes(i)?`<input data-i="${i}" size="${Math.max(3,w.length)}" autocomplete="off" autocapitalize="off" spellcheck="false">`:esc(w)).join(" ")}</div>`;
else body=`<textarea id="t" rows="3" placeholder="Type the full phrase from memory..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`;
$("#app").innerHTML=`<div class="row"><span>${done} / ${tot} done</span><span>Level ${lv} · ${cl?"fill the blanks":"full recall"}</span></div><div class="bar"><i style="width:${done/tot*100}%"></i></div>
<div class="card"><div class="tag">${d[0]}</div><div class="ctx">${d[1]}</div>${body}
<button class="btn" id="go" onclick="check()">Check</button><div id="r"></div>
<div class="hint">Placeholders like [Name] or [X] can be skipped. Press Enter to check.</div></div>`;
const f=$("#t")||document.querySelector(".cl input");f&&f.focus()}
let cur_h=[];
function check(){if(stage!="ask")return;const d=D[cur],ws=d[2].split(" ");let ok,wrongSet=new Set();
if(cur_h.length){ok=true;document.querySelectorAll(".cl input").forEach(el=>{const i=+el.dataset.i,g=nw(el.value).join(" "),a=nw(ws[i]).join(" ");if(g==a)el.classList.add("v");else{ok=false;el.classList.add("x");wrongSet.add(i);el.value=ws[i]}el.readOnly=true})}
else{const g=nw($("#t").value),a=nw(d[2]);const l=lcs(g,a);ok=a.length>0&&l/a.length>=.9&&g.length<=a.length+3;
const gs=new Set(g);ws.forEach((w,i)=>{const n=nw(w);if(n.length&&!gs.has(n[0]))wrongSet.add(i)});$("#t").readOnly=true}
if(first[cur]===undefined)first[cur]=ok;
$("#go").remove();
if(ok){stage="ok";box[cur]=first[cur]?Math.min(5,B(cur)+1):B(cur);save();done++;right++;
$("#r").innerHTML=`<div class="res ok ui"><b>Correct.</b> <span class="ans" style="font-family:Georgia,serif">${esc(d[2])}</span></div><button class="btn" id="nx" onclick="next()">Next</button>`;$("#nx").focus()}
else{stage="fix";box[cur]=1;save();missed.add(cur);
const sh=ws.map((w,i)=>wrongSet.has(i)?`<span class="miss">${esc(w)}</span>`:esc(w)).join(" ");
$("#r").innerHTML=`<div class="res no"><b class="h">Not quite. Here is the answer:</b><div class="ans">${sh}</div></div>
<div class="hint" style="margin-top:14px">Now type the correct phrase to lock it in:</div><textarea id="fx" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><button class="btn" onclick="fix()">Lock it in</button>`;$("#fx").focus()}}
function fix(){const a=nw(D[cur][2]),g=nw($("#fx").value);if(lcs(g,a)/a.length>=.95&&g.length<=a.length+1){Q.splice(Math.min(3,Q.length),0,cur);stage="idle";next()}else{$("#fx").style.borderColor="var(--no)";$("#fx").focus()}}
function end(){stage="idle";const acc=Math.round(Object.values(first).filter(Boolean).length/tot*100);
$("#app").innerHTML=`<div class="card"><div class="tag">Session complete</div><div class="ctx">First-try accuracy: ${acc}%</div>${stats()}
${missed.size?`<div class="tag">Cards you missed</div><ul>${[...missed].map(i=>`<li><span class="ui" style="color:var(--mu)">${D[i][1]}:</span> ${esc(D[i][2])}</li>`).join("")}</ul>`:"<p>Perfect round. Run it again to keep pushing levels.</p>"}
<button class="btn" onclick="start()">Drill again</button><button class="btn g" style="margin-left:8px" onclick="home()">Menu</button></div>`}
document.addEventListener("keydown",e=>{if(e.key!="Enter"||e.shiftKey)return;if(stage=="ask"){e.preventDefault();check()}else if(stage=="fix"){e.preventDefault();fix()}else if(stage=="ok"){e.preventDefault();next()}});
home();
</script></body></html>
